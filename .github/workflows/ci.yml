name: CI Front LOC MNS

on:
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USER }}/frontend-locmns:latest .
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USER }}/frontend-locmns:latest
