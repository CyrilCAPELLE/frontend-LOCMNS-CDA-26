<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">LOC</div>
      <h1 class="login-title">Bon retour</h1>
      <p class="login-subtitle">Connectez-vous a votre compte</p>
    </div>
    <form class="login-body" [formGroup]="formulaire" (ngSubmit)="onConnexion()">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="email" formControlName="email">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" class="form-input" placeholder="mot_de_passe" formControlName="motDePasse">
      </div>
      <div class="login-options">
        <label><input type="checkbox"> Se souvenir de moi</label>
        <a href="#">Mot de passe oublie ?</a>
      </div>
      @if (erreur) {
        <p class="login-erreur">{{ erreur }}</p>
      }
      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px">Se connecter</button>
    </form>
    <div class="login-footer">
      Vous n'avez pas de compte ? <a href="#">Creer un compte</a>
    </div>
  </div>
</div>
