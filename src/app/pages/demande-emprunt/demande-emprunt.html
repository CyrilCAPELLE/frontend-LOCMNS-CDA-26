<a routerLink="/emprunts"
   style="display:inline-block;font-size:12px;color:var(--blue-primary);margin-bottom:12px">← Retour</a>

<div class="page-header">
  <h1 class="page-title">Demande d'emprunt</h1>
  <p class="page-subtitle">Créer une nouvelle demande de prêt</p>
</div>

<div style="display:grid;grid-template-columns:2fr 1fr;gap:24px" class="form-layout">

  <!-- Formulaire -->
  <div class="card">

    <div class="form-group">
      <label class="form-label">Famille de matériel</label>
      <div class="form-hint">Filtré selon votre profil (relation Accéder)</div>
      <select class="form-select">
        <option value="">-- Sélectionnez --</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Matériel souhaité</label>
      <select class="form-select">
        <option value="">-- Sélectionnez d'abord une famille --</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date de début</label>
        <input type="date" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Date de retour prévue</label>
        <input type="date" class="form-input">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Motif / commentaire</label>
      <textarea class="form-textarea" placeholder="Précisez l'usage prévu..."></textarea>
    </div>

    <button class="btn btn-primary" style="width:100%">Soumettre la demande</button>
  </div>

  <!-- Mes demandes (à droite) -->
  <div>
    <div style="font-size:14px;font-weight:700;color:var(--slate-900);margin-bottom:8px">Mes demandes</div>
    <div style="font-size:9px;color:var(--slate-300);margin-bottom:12px">statut_demande</div>

    <!-- Les cartes "Mes demandes" seront générées dynamiquement plus tard -->
    <div class="card" style="margin-bottom:8px;color:var(--slate-500);text-align:center;padding:20px">
      Aucune demande pour le moment
    </div>
  </div>

</div>

<style>@media(max-width:768px){.form-layout{grid-template-columns:1fr!important}}</style>
