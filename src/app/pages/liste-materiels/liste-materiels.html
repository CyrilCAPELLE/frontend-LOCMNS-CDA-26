<h1>Materiel</h1>

<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th scope="col">Non du matériel</th>
      <th scope="col">Numéro de série</th>
      <th scope="col">Famille</th>
      <th scope="col">Etat</th>
    </tr>
  </thead>
  <tbody>
    @for (materiel of materiels(); track materiel.id) {
        <tr>
            <td data-label="Nom du matériel"><a [routerLink]="'/materiel/' 
            + materiel.id">{{ materiel.nomMateriel }}</a></td>
            <td data-label="Numéro de série">{{ materiel.numeroDeSerie }}</td>
            <td data-label="Famille">{{ materiel.familleMateriel?.libelleFamilleMateriel }}</td>
            <td data-label="État"
                [class.etat-maintenance]="materiel.etat?.libelleEtat === 'En maintenance'"
                [class.etat-hors-service]="materiel.etat?.libelleEtat === 'Hors service'">
              {{ materiel.etat?.libelleEtat }}
            </td>
        </tr>
    }
  </tbody>
</table>
