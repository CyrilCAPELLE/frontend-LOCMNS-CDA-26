<h1>Utilisateurs</h1>

@for (personne of personnes(); track personne.id) {
  <div class="card" style="margin-bottom:10px; display:flex; flex-direction:row; justify-content:space-between; align-items:center;">
    <div>
      <a [routerLink]="'/personne/' + personne.id" style="font-size:14px; font-weight:600;">{{ personne.prenom }} {{ personne.nom }}</a>
      <div style="color:var(--slate-500); font-size:12px; margin-top:2px;">{{ personne.email }}</div>
    </div>
    <span class="badge" [class.badge-green]="personne.actif" [class.badge-slate]="!personne.actif">
      {{ personne.actif ? 'Actif' : 'Inactif' }}
    </span>
  </div>
} @empty {
  <div class="empty-state">Aucun utilisateur pour le moment</div>
}
